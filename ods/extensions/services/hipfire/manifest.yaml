schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: hipfire
  name: hipfire (RDNA-native LLM engine)
  aliases: []
  container_name: ods-hipfire
  default_host: hipfire
  port: 11435
  external_port_env: HIPFIRE_PORT
  external_port_default: 11435
  health: /health
  # A cold start compiles/loads a 22.8 GB MQ4 onto one card; /health returns 503
  # until the model is resident.
  health_timeout: 300
  type: docker
  # AMD-only by construction: hipfire is a HIP/ROCm-direct engine with no
  # CPU/CUDA path (upstream explicitly rejects a cross-vendor backend).
  gpu_backends: [amd]
  compose_file: compose.yaml
  category: optional
  depends_on: []

features:
  - id: fast-text
    name: Fast local text inference
    # No build-time arch pin since the 2026-08-16 upstream restructure: kernels
    # are hipcc-JIT-compiled on first use for whatever arch the daemon finds and
    # cached in the mounted kernel volume, so one image serves every supported
    # RDNA target. Upstream validates RDNA3 (gfx1100-gfx1103), RDNA3.5
    # (gfx1150-gfx1152), and RDNA4 (gfx1200/gfx1201); locally exercised on
    # gfx1201. A different card costs a one-time JIT pass, not a rebuild.
    description: RDNA-native text generation on Radeon GPUs (RDNA3/3.5/4; validated locally on gfx1201)
    icon: Zap
    category: core
    requirements:
      services: [hipfire]
      vram_gb: 24
    enabled_services_all: [hipfire]
    setup_time: Ready
    priority: 5
    launch:
      type: service
      service: hipfire
    gpu_backends: [amd]
