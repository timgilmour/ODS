# AEON profile: Laguna-S-2.1-NVFP4 (poolside, dense 48L, text-only coding model)
# NOTE: compressed-tensors NVFP4 checkpoint — NO --quantization flag (auto-detect);
# forcing modelopt (like the Qwen3.6 profiles) breaks the load.
# No reasoning/tool parsers: poolside chat template is not qwen3-family.
# KV @ fp8 ≈ 96 KiB/token → 131072 ctx ≈ 12.9 G KV/seq; util 0.80 leaves ~28 G
# for KV+overhead over the ~72 G weights. Native ctx is 262144 — raise later if wanted.
services:
  aeon-vllm:
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-07-27-v0.26.0@sha256:1aa47363e4c9cfa0a85411c669d39b7f9fa3adb3e735ef1ca5760be3044dacd7
    container_name: aeon-vllm
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    volumes:
      - /home/tim/vllm/cache/flashinfer:/root/.cache/flashinfer
      - /home/tim/vllm/cache/vllm:/root/.cache/vllm
      - /home/tim/models/Laguna-S-2.1-NVFP4:/model:ro
    entrypoint: ["vllm"]
    command:
      - serve
      - /model
      - --served-model-name
      - laguna
      - --dtype
      - auto
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - TRITON_ATTN
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "32768"
      - --gpu-memory-utilization
      - "0.80"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --generation-config
      - vllm
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
