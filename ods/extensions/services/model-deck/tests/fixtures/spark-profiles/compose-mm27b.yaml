# AEON vLLM Ultimate on Sparky — adapted from AEON-7/vllm-ultimate-dgx-spark README
# Pinned to the dated tag (= :latest as of 2026-07-29). Rollback: 2026-07-16-v0.25.1
services:
  aeon-vllm:
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-07-27-v0.26.0@sha256:1aa47363e4c9cfa0a85411c669d39b7f9fa3adb3e735ef1ca5760be3044dacd7
    container_name: aeon-vllm
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    volumes:
      - /home/tim/vllm/cache/flashinfer:/root/.cache/flashinfer
      - /home/tim/vllm/cache/vllm:/root/.cache/vllm
      - /home/tim/models/Qwen3.6-27B-AEON-MM-MTP:/model:ro
      - /home/tim/models/Qwen3.6-27B-DFlash-drafter:/drafter:ro
    entrypoint: ["vllm"]
    command:
      - serve
      - /model
      - --served-model-name
      - aeon
      - aeon-fast
      - aeon-deep
      - aeon-ultimate
      - qwen36-ultimate
      - aeon-ultimate-xs
      - --dtype
      - auto
      - --quantization
      - modelopt
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - TRITON_ATTN
      - --max-model-len
      - "229376"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "32768"
      - --gpu-memory-utilization
      - "0.60"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --generation-config
      - vllm
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      - --mm-encoder-tp-mode
      - data
      - --speculative-config
      - '{"method":"dflash","model":"/drafter","num_speculative_tokens":12,"attention_backend":"TRITON_ATTN"}'
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
