# AEON profile: Qwen3.5-122B-A10B-NVFP4 (unsloth; MoE 256E/8A, multimodal, ships MTP weights)
# NOTE: compressed-tensors NVFP4 checkpoint — NO --quantization flag (auto-detect).
# MTP spec-decode via generic {"method":"mtp"} using the bundled model_mtp.safetensors;
# if boot fails at spec-config/arch resolution, drop --speculative-config and retry plain.
# KV is very light (GQA-2, ~48 KiB/token fp8) → full native 262144 ctx ≈ 12.9 G/seq;
# weights ~79 G ⇒ util 0.85 (~106 G budget) leaves room for vision encoder + MTP + KV.
services:
  aeon-vllm:
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-07-27-v0.26.0@sha256:1aa47363e4c9cfa0a85411c669d39b7f9fa3adb3e735ef1ca5760be3044dacd7
    container_name: aeon-vllm
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      VLLM_USE_FLASHINFER_SAMPLER: "1"
    volumes:
      - /home/tim/vllm/cache/flashinfer:/root/.cache/flashinfer
      - /home/tim/vllm/cache/vllm:/root/.cache/vllm
      - /home/tim/models/Qwen3.5-122B-A10B-NVFP4:/model:ro
    entrypoint: ["vllm"]
    command:
      - serve
      - /model
      - --served-model-name
      - qwen35
      - --dtype
      - auto
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - TRITON_ATTN
      - --max-model-len
      - "131072"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "32768"
      - --gpu-memory-utilization
      - "0.70"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --generation-config
      - vllm
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      - --mm-encoder-tp-mode
      - data
      - --speculative-config
      - "{\"method\":\"mtp\",\"num_speculative_tokens\":2}"
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
