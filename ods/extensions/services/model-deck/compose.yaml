services:
  model-deck:
    build: { context: ./extensions/services/model-deck }
    image: ods-model-deck:latest
    container_name: ods-model-deck
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${MODEL_DECK_PORT:-3015}:3015"]
    environment:
      - MODEL_DECK_ADMIN_TOKEN=${MODEL_DECK_ADMIN_TOKEN:?set in .env}
      - MODEL_DECK_PROXY_KEY=${MODEL_DECK_PROXY_KEY:-}
      - LEMONADE_API_KEY=${LEMONADE_API_KEY:-}
      - LITELLM_KEY=${LITELLM_KEY:-}
      - HOST_AGENT_KEY=${HOST_AGENT_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data/model-deck:/data:z
      - ./data/models:/gguf-store:ro,z
      - /sys/class/drm:/sysdrm:ro
      - /sys/class/kfd/kfd/proc:/syskfd:ro
    # Sits on BOTH the stack default network (ods-network — keeps litellm,
    # llama-server, comfyui, hipfire DNS resolving) AND the private deck-ctl
    # network it shares only with the socket proxy.
    networks: [default, deck-ctl]
    depends_on: [docker-ctl]
  docker-ctl:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ods-docker-ctl
    restart: unless-stopped
    environment: { CONTAINERS: 1, POST: 1, ALLOW_START: 1, ALLOW_STOP: 1 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    # ONLY on the private, internal deck-ctl network — no sibling stack
    # container can reach the docker socket proxy, only model-deck can.
    networks: [deck-ctl]

networks:
  # Private, host-isolated bridge shared by model-deck and the socket proxy
  # only. Declared here and merged with the base stack's `default`
  # (ods-network) — mirrors docker-compose.base.yml's networks convention.
  deck-ctl:
    name: ods-deck-ctl
    internal: true
