services:
  model-deck:
    build: { context: ./extensions/services/model-deck }
    image: ods-model-deck:latest
    container_name: ods-model-deck
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${MODEL_DECK_PORT:-3015}:3015"]
    environment:
      # No MODEL_DECK_ADMIN_TOKEN/PROXY_KEY: the admin gate was deliberately
      # removed 2026-07-22 (ops-first; LAN path still behind Authelia).
      - LEMONADE_API_KEY=${LEMONADE_API_KEY:-}
      - LITELLM_KEY=${LITELLM_KEY:-}
      - HOST_AGENT_KEY=${ODS_AGENT_KEY:-} # live installs name the agent key ODS_AGENT_KEY
      # What this box is called on the deck board. Unset ⇒ "local".
      - MODEL_DECK_NODE_LABEL=${MODEL_DECK_NODE_LABEL:-local}
      # Update checking (app/update_check.py) — the ONLY part of the deck
      # that talks to the public internet. Default ON: a stock install
      # declares no origins, so nothing is watched and no request is made.
      # The `:-true`/`:-21600` fallbacks are load-bearing, not cosmetic —
      # a bare `${VAR:-}` ships an EMPTY value rather than an absent one,
      # and only app/settings.py:25's `env_ignore_empty=True` would then
      # keep the field default; spelling the default here means the compose
      # file states it too, exactly as MODEL_DECK_NODE_LABEL above does.
      - MODEL_DECK_UPDATE_CHECK_ENABLED=${MODEL_DECK_UPDATE_CHECK_ENABLED:-true}
      - MODEL_DECK_UPDATE_INTERVAL_S=${MODEL_DECK_UPDATE_INTERVAL_S:-21600}
      # Spark (remote single-slot node) — engine stays unbuilt unless the
      # URLs are set AND ODS_REMOTE_NODE_KEYS carries an entry for the node
      # (same credential dashboard-api's remote-node poller uses).
      - MODEL_DECK_SPARK_NODE_URL=${MODEL_DECK_SPARK_NODE_URL:-}
      - MODEL_DECK_SPARK_SERVING_URL=${MODEL_DECK_SPARK_SERVING_URL:-}
      - MODEL_DECK_SPARK_NODE_NAME=${MODEL_DECK_SPARK_NODE_NAME:-sparky}
      - ODS_REMOTE_NODE_KEYS=${ODS_REMOTE_NODE_KEYS:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data/model-deck:/data:z
      - ./data/models:/gguf-store:ro,z
      # Whole-/sys ro mount: /sys/class/drm entries are symlinks into
      # /sys/devices, so binding the class dir alone leaves them dangling.
      - /sys:/sysfs:ro
      # --- Storage tiering (optional) --------------------------------------
      # Each storage location needs a rw bind mount here + a registration in
      # the deck UI (Storage tab) or POST /api/storage/locations. Examples:
      #   - /mnt/cold/models:/stores/cold:z        # cold archive drive
      #   - ./data/models:/stores/gguf-hot:z       # rw view of the GGUF store
      #     (register as role=hot, store_type=gguf, engine=lemonade; the
      #     read-only /gguf-store mount above stays — registry keeps using it)
      # An unregistered mount does nothing; an unmounted registered location
      # shows as "unavailable" and is never written to (marker-file check).
    # Sits on BOTH the stack default network (ods-network — keeps litellm,
    # llama-server, comfyui, hipfire DNS resolving) AND the private deck-ctl
    # network it shares only with the socket proxy.
    networks: [default, deck-ctl]
    depends_on: [docker-ctl]
  docker-ctl:
    # wollomatic over tecnativa: tecnativa's env ACL cannot express
    # "start/stop yes, create no" (POST=1 also opens /containers/create —
    # a host-root primitive, verified live; without POST=1 nothing mutates).
    # wollomatic takes explicit per-method path regexes.
    image: wollomatic/socket-proxy:1
    container_name: ods-docker-ctl
    restart: unless-stopped
    # Non-root image; needs the host docker group to read the socket.
    group_add: ["${DOCKER_SOCK_GID:-984}"]
    command:
      - -listenip=0.0.0.0
      - -proxyport=2375
      - -allowfrom=0.0.0.0/0 # source control = the internal-only network
      # wollomatic auto-anchors patterns — no explicit ^…$ here.
      - -allowGET=/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/json
      - -allowPOST=/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/(start|stop)
      # NO exec rules, deliberately [max-review #5]. C1's local catalog
      # harvest was the only exec caller and C2 removed it — harvest now
      # reads the node-agent's file-protocol cache instead. The in-process
      # DockerCtl.exec_run/_guard machinery is kept behind an injection
      # seam with ZERO production constructors (app/main.py says so at the
      # spot where it deliberately does not build DockerEngineExec), so
      # these two rules granted a standing capability nothing used.
      #
      # exec runs an ARBITRARY command as root in the named container, so
      # the unused grant was the whole host's blast radius sitting open
      # with only a client-side allowlist in front of it. If a future
      # increment re-wires a local harvest, re-add BOTH rules (the
      # container-PINNED create-exec — never the wildcard the start/stop
      # rules use — plus the wildcarded /exec/{id}/start, whose id Docker
      # generates per call and which therefore has no name to pin)
      # alongside the Watcher._configurable_engines entry that uses them,
      # never ahead of it.
      - -watchdoginterval=300
      - -shutdowngracetime=5
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    # ONLY on the private, internal deck-ctl network — no sibling stack
    # container can reach the docker socket proxy, only model-deck can.
    networks: [deck-ctl]

networks:
  # Private, host-isolated bridge shared by model-deck and the socket proxy
  # only. Declared here and merged with the base stack's `default`
  # (ods-network) — mirrors docker-compose.base.yml's networks convention.
  deck-ctl:
    name: ods-deck-ctl
    internal: true
